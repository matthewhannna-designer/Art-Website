<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5000 1000" role="img" aria-label="Matthew Hanna logo">
  <defs>
    <pattern id="dither" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#ffffff" fill-opacity="0"/>
      <rect x="0" y="0" width="100" height="100" fill="#2CFF05"/>
      <rect x="100" y="100" width="100" height="100" fill="#2CFF05"/>
    </pattern>
  </defs>
  <g fill="url(#dither)" stroke="#2CFF05" stroke-width="6" stroke-miterlimit="10">
    <polygon points="0 1000 0 0 1000 1000 2000 0 2000 1000 0 1000"/>
    <rect x="2500" width="1000" height="1000"/>
    <rect x="4000" width="1000" height="1000"/>
  </g>
  <g fill="none" stroke="#2CFF05" stroke-width="40" stroke-linecap="square">
    <line x1="2000" y1="1000" x2="2000" y2="0"/>
  </g>
</svg>
