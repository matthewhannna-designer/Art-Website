      <path d="M0 0 Q6 -7 12 0 T24 0 T36 0" fill="none" stroke="#d0d0d0" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="-1" r="3.5" fill="#d0d0d0"/>
      <path d="M40 -4 L44 -8 L45 -3 Z" fill="#d0d0d0"/>
      <circle cx="41" cy="-2" r="0.9" fill="#2a2a2a"/>
    </g>
    <path transform="translate(250,215) scale(1.5)" d="M0 6 C-6 2 -8 -2 -4 -5 C-2 -6 0 -4 0 -2 C0 -4 2 -6 4 -5 C8 -2 6 2 0 6 Z" fill="#e63946"/>
