<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Map of Victoria in light grey with rivers, animated dithered sea, a small sea monster, labelled towns, neighbouring states in grey and a red heart on Melbourne">
