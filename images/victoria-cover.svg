      <rect x="2" y="2" width="2" height="2" fill="#4a4a4a"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;4 0;8 0;12 0;0 0" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#sea)"/>
  <g transform="translate(190,25) scale(1.2)">
