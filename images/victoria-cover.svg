    <g fill="none" stroke="#7a7a7a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 55 Q150 45 260 50 Q295 46 305 38"/>
      <path d="M230 60 Q215 110 240 150 L255 190"/>
      <path d="M170 80 Q180 120 165 150"/>
      <path d="M100 90 Q130 110 150 150"/>
      <path d="M150 170 Q110 200 90 230 L75 250"/>
      <path d="M120 175 Q135 205 150 225 Q140 245 125 255"/>
      <path d="M330 120 Q300 150 285 175 Q265 195 250 218"/>
    </g>
    <g transform="translate(340,300)">
