<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Hanna | Original Art, Melbourne</title>
  <meta name="description" content="Original art by Matthew Hanna, based in Melbourne, Victoria, Australia. Contact for enquiries and commissions.">
  <meta name="author" content="Matthew Hanna">
  <meta name="robots" content="index, follow, noai, noimageai">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Matthew Hanna | Original Art">
  <meta property="og:description" content="Original art by Matthew Hanna, based in Melbourne, Victoria, Australia.">
  <meta property="og:locale" content="en_AU">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Matthew Hanna",
    "jobTitle": "Artist",
    "email": "mailto:matthewhannna@gmail.com",
    "telephone": "+61447243435",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Melbourne",
      "addressRegion": "VIC",
      "addressCountry": "AU"
    },
    "sameAs": ["https://www.instagram.com/matthewarchitect"]
  }
  </script>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --gap: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header, footer {
      padding: 32px 24px;
      text-align: center;
    }
    header h1 {
      font-weight: 300;
      font-size: 2rem;
      letter-spacing: 0.05em;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--gap);
    }
    .cover img {
      display: block;
      width: 100%;
      height: auto;
    }
    figure img {
      width: 100%;
      height: auto;
      display: block;
    }
    figcaption {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }
    .intro.done {
      opacity: 0;
      pointer-events: none;
    }
    .sb {
      position: relative;
      width: min(70vw, 360px);
      height: min(80vh, 500px);
    }
    .sb-page {
      position: absolute;
      inset: 0;
      background: #f7f5f2;
      border-radius: 4px;
    }
    .sb-cover {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      color: #ffffff;
      border-radius: 4px 10px 10px 4px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transform-origin: left center;
      transition: transform 1.4s cubic-bezier(0.6, 0.05, 0.3, 1);
      box-shadow: 8px 8px 24px rgba(0, 0, 0, 0.4);
    }
    .sb-cover::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: #000000;
      border-radius: 4px 0 0 4px;
    }
    .sb-cover h2 {
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.2;
    }
    .sb-cover p {
      margin-top: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #bdbdbd;
    }
    .intro.open .sb-cover {
      transform: rotateY(-160deg);
    }
    :root {
      --cm: 3px;
    }
    .room {
      background: #2a2a2a;
      padding: 24px 0;
    }
    .wall-strip {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
    }
    .wall {
      position: relative;
      flex: 0 0 min(900px, 100vw);
      height: 420px;
      scroll-snap-align: start;
      background: linear-gradient(#ebe8e3, #e2ded7);
    }
    .skirt {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 90px;
      height: 14px;
      background: #cfcbc4;
      border-top: 1px solid #bdb8af;
    }
    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 90px;
      background: repeating-linear-gradient(90deg, #b9b2a8 0 60px, #aca59a 60px 61px);
    }
    .frame {
      position: absolute;
      bottom: 150px;
      left: var(--x);
      width: calc(var(--w) * var(--cm));
      height: calc(var(--h) * var(--cm));
      background: #ffffff;
      padding: 8px;
      box-shadow: 4px 6px 14px rgba(0, 0, 0, 0.25);
    }
    .frame .art {
      width: 100%;
      height: 100%;
      background: #d6d2cb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #6b6b6b;
      text-align: center;
    }
    .lamp {
      position: absolute;
      top: 0;
      left: calc(var(--x) + (var(--w) * var(--cm)) / 2);
      width: 0;
      height: 0;
    }
    .lamp::before {
      content: "";
      position: absolute;
      left: -14px;
      top: 0;
      width: 28px;
      height: 8px;
      background: #1a1a1a;
    }
    .lamp::after {
      content: "";
      position: absolute;
      left: -40px;
      top: 8px;
      width: 80px;
      height: 260px;
      background: linear-gradient(rgba(255, 244, 214, 0.45), rgba(255, 244, 214, 0));
      clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="intro" id="intro">
    <div class="sb">
      <div class="sb-page"></div>
      <div class="sb-cover">
        <h2>Matthew Hanna</h2>
        <p>Sketchbook</p>
      </div>
    </div>
  </div>

  <section class="cover">
    <img src="images/victoria-cover.svg" alt="Simple grey map of Victoria with a red heart on Melbourne" width="800" height="450">
  </section>

  <header>
    <h1>Matthew Hanna</h1>
  </header>

  <section class="room" aria-label="Gallery room">
    <div class="wall-strip">
      <div class="wall">
        <div class="skirt"></div>
        <div class="floor"></div>
        <div class="lamp" style="--x: 60px; --w: 60;"></div>
        <div class="frame" style="--x: 60px; --w: 60; --h: 80;"><div class="art">Artwork 60 x 80 cm</div></div>
        <div class="lamp" style="--x: 360px; --w: 100;"></div>
        <div class="frame" style="--x: 360px; --w: 100; --h: 70;"><div class="art">Artwork 100 x 70 cm</div></div>
        <div class="lamp" style="--x: 640px; --w: 40;"></div>
        <div class="frame" style="--x: 640px; --w: 40; --h: 50;"><div class="art">Artwork 40 x 50 cm</div></div>
      </div>
      <div class="wall">
        <div class="skirt"></div>
        <div class="floor"></div>
        <div class="lamp" style="--x: 200px; --w: 80;"></div>
        <div class="frame" style="--x: 200px; --w: 80; --h: 60;"><div class="art">Artwork 80 x 60 cm</div></div>
        <div class="lamp" style="--x: 560px; --w: 50;"></div>
        <div class="frame" style="--x: 560px; --w: 50; --h: 70;"><div class="art">Artwork 50 x 70 cm</div></div>
      </div>
    </div>
  </section>

  <main>
    <!-- Add a new <figure> for each artwork. Put the image file in the images folder. -->
    <figure>
      <img src="images/placeholder.svg" alt="Placeholder artwork" loading="lazy">
      <figcaption>Title, year, medium</figcaption>
    </figure>
  </main>

  <footer>
    <p>Based in Melbourne, Victoria</p>
    <p>Email: <a href="mailto:matthewhannna@gmail.com">matthewhannna@gmail.com</a></p>
    <p>Phone: <a href="tel:+61447243435">0447 243 435</a></p>
    <p>Instagram: <a href="https://www.instagram.com/matthewarchitect" rel="noopener">@matthewarchitect</a></p>
  </footer>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      function openBook() {
        if (intro.classList.contains('open')) return;
        intro.classList.add('open');
        setTimeout(function () { intro.classList.add('done'); }, 1800);
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        intro.classList.add('done');
        return;
      }
      setTimeout(openBook, 900);
      intro.addEventListener('click', openBook);
    })();
  </script>
</body>
</html>
