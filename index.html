<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Hanna | Original Art, Melbourne</title>
  <meta name="description" content="Original art by Matthew Hanna, based in Melbourne, Victoria, Australia. Contact for enquiries and commissions.">
  <meta name="author" content="Matthew Hanna">
  <meta name="robots" content="index, follow, noai, noimageai">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Matthew Hanna | Original Art">
  <meta property="og:description" content="Original art by Matthew Hanna, based in Melbourne, Victoria, Australia.">
  <meta property="og:locale" content="en_AU">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Matthew Hanna",
    "jobTitle": "Artist",
    "email": "mailto:matthewhannna@gmail.com",
    "telephone": "+61447243435",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Melbourne",
      "addressRegion": "VIC",
      "addressCountry": "AU"
    },
    "sameAs": ["https://www.instagram.com/matthewarchitect"]
  }
  </script>
  <style>
    :root {
      --bg: #f7f5f2;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --gap: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    header, footer {
      padding: 32px 24px;
      text-align: center;
    }
    header h1 {
      font-weight: 300;
      font-size: 2rem;
      letter-spacing: 0.05em;
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 48px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--gap);
    }
    .cover img {
      display: block;
      width: 100%;
      height: auto;
    }
    figure img {
      width: 100%;
      height: auto;
      display: block;
    }
    figcaption {
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .intro {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      cursor: pointer;
      transition: opacity 0.6s ease;
    }
    .intro.done {
      opacity: 0;
      pointer-events: none;
    }
    .sb {
      position: relative;
      width: min(70vw, 360px);
      height: min(80vh, 500px);
    }
    .sb-page {
      position: absolute;
      inset: 0;
      background: #f7f5f2;
      border-radius: 4px;
    }
    .sb-cover {
      position: absolute;
      inset: 0;
      background: #1a1a1a;
      color: #ffffff;
      border-radius: 4px 10px 10px 4px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transform-origin: left center;
      transition: transform 1.4s cubic-bezier(0.6, 0.05, 0.3, 1);
      box-shadow: 8px 8px 24px rgba(0, 0, 0, 0.4);
    }
    .sb-cover::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 10px;
      background: #000000;
      border-radius: 4px 0 0 4px;
    }
    .sb-cover h2 {
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.2;
    }
    .sb-cover p {
      margin-top: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #bdbdbd;
    }
    .intro.open .sb-cover {
      transform: rotateY(-160deg);
    }
  </style>
</head>
<body>
  <div class="intro" id="intro">
    <div class="sb">
      <div class="sb-page"></div>
      <div class="sb-cover">
        <h2>Matthew Hanna</h2>
        <p>Sketchbook</p>
      </div>
    </div>
  </div>

  <section class="cover">
    <img src="images/victoria-cover.svg" alt="Simple grey map of Victoria with a red heart on Melbourne" width="800" height="450">
  </section>

  <header>
    <h1>Matthew Hanna</h1>
  </header>

  <main>
    <!-- Add a new <figure> for each artwork. Put the image file in the images folder. -->
    <figure>
      <img src="images/placeholder.svg" alt="Placeholder artwork" loading="lazy">
      <figcaption>Title, year, medium</figcaption>
    </figure>
  </main>

  <footer>
    <p>Based in Melbourne, Victoria</p>
    <p>Email: <a href="mailto:matthewhannna@gmail.com">matthewhannna@gmail.com</a></p>
    <p>Phone: <a href="tel:+61447243435">0447 243 435</a></p>
    <p>Instagram: <a href="https://www.instagram.com/matthewarchitect" rel="noopener">@matthewarchitect</a></p>
  </footer>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      function openBook() {
        if (intro.classList.contains('open')) return;
        intro.classList.add('open');
        setTimeout(function () { intro.classList.add('done'); }, 1800);
      }
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        intro.classList.add('done');
        return;
      }
      setTimeout(openBook, 900);
      intro.addEventListener('click', openBook);
    })();
  </script>
</body>
</html>
